apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mobix
resources:
  - ../base
  - mongodb.yaml
  - rabbitmq.yaml
  - redis.yaml
secretGenerator:
  - name: mobix-dependencies
    literals:
      - internal-signing-key=mobix-demo-internal-key-replace-before-sharing
      - bootstrap-email=operator@mobix.test
      - bootstrap-password=mobix-demo-operator-password
      - accounts-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - redis-url=redis://redis:6379/0
      - rate-limit-key=mobix-demo-rate-limit-key-replace-before-sharing
      - trip-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - driver-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - payment-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - trip-rabbitmq-url=amqp://mobix:mobix-demo@rabbitmq:5672/
      - payment-rabbitmq-url=amqp://mobix:mobix-demo@rabbitmq:5672/
      - mongo-password=mobix-demo
      - rabbit-password=mobix-demo

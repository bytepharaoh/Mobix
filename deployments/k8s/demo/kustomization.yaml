apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mobix
resources:
  - ../base
  - mongodb.yaml
  - rabbitmq.yaml
secretGenerator:
  - name: mobix-dependencies
    literals:
      - gateway-api-key=mobix-demo-key
      - trip-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - driver-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - payment-mongo-uri=mongodb://admin:mobix-demo@mongodb:27017/?authSource=admin
      - trip-rabbitmq-url=amqp://mobix:mobix-demo@rabbitmq:5672/
      - payment-rabbitmq-url=amqp://mobix:mobix-demo@rabbitmq:5672/
      - mongo-password=mobix-demo
      - rabbit-password=mobix-demo

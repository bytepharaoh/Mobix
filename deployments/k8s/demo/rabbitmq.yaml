apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: mobix
  ports:
    - name: amqp
      port: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
      app.kubernetes.io/part-of: mobix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: mobix
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2-management
          ports:
            - name: amqp
              containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: mobix
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: rabbit-password
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 3
          volumeMounts:
            - name: broker
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: broker
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

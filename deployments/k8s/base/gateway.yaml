apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: mobix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: mobix
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: mobix/gateway:local
          imagePullPolicy: IfNotPresent
          env:
            - name: MOBIX_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: internal-signing-key
            - name: TRIP_URL
              value: "http://trip:8082"
            - name: DRIVER_URL
              value: "http://driver:8083"
            - name: PAYMENT_URL
              value: "http://payment:8084"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: gateway-rabbitmq-url
            - name: MONGO_DB
              value: mobix_accounts
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: accounts-mongo-uri
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: redis-url
            - name: RATE_LIMIT_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: rate-limit-key
            - name: TRUSTED_PROXY_CIDRS
              value: ""
            - name: SSE_MAX_CONNECTIONS
              value: "1000"
            - name: SSE_MAX_CONNECTIONS_PER_ACCOUNT
              value: "5"
            - name: MOBIX_BOOTSTRAP_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: bootstrap-email
            - name: MOBIX_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: bootstrap-password
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 160Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 25
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: mobix
  ports:
    - name: http
      port: 8080
      targetPort: http

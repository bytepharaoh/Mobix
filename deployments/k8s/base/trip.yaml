apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trip
      app.kubernetes.io/part-of: mobix
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trip
        app.kubernetes.io/part-of: mobix
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trip
          image: mobix/trip:local
          imagePullPolicy: IfNotPresent
          env:
            - name: MOBIX_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: internal-signing-key
            - name: DRIVER_URL
              value: "http://driver:8083"
            - name: MONGO_DB
              value: "mobix"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: trip-mongo-uri
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: mobix-dependencies
                  key: trip-rabbitmq-url
          ports:
            - name: http
              containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 160Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 25
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trip
spec:
  selector:
    app.kubernetes.io/name: trip
    app.kubernetes.io/part-of: mobix
  ports:
    - name: http
      port: 8082
      targetPort: http

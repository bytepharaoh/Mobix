x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-mongo-env: &mongo-env
  MONGO_HOST: mongodb
  MONGO_USER: ${MONGO_USER:-admin}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-password}

x-rabbit-env: &rabbit-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-mobix}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-mobix-local}

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 15
  start_period: 8s

services:
  gateway:
    <<: *app
    image: mobix/gateway:local
    build:
      context: .
      args: {SERVICE: gateway}
    environment:
      TRIP_URL: http://trip:8082
      DRIVER_URL: http://driver:8083
      PAYMENT_URL: http://payment:8084
      MOBIX_API_KEY: ${MOBIX_API_KEY:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      trip: {condition: service_healthy}
      driver: {condition: service_healthy}
      payment: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/ready"]

  trip:
    <<: *app
    image: mobix/trip:local
    build:
      context: .
      args: {SERVICE: trip}
    environment:
      <<: [*mongo-env, *rabbit-env]
      MONGO_DB: ${MONGO_DB:-mobix}
      DRIVER_URL: http://driver:8083
    depends_on:
      mongodb: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8082/ready"]

  driver:
    <<: *app
    image: mobix/driver:local
    build:
      context: .
      args: {SERVICE: driver}
    environment:
      <<: *mongo-env
      MONGO_DB: ${MONGO_DB:-mobix}
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8083/ready"]

  payment:
    <<: *app
    image: mobix/payment:local
    build:
      context: .
      args: {SERVICE: payment}
    environment:
      <<: [*mongo-env, *rabbit-env]
      MONGO_DB: ${PAYMENT_MONGO_DB:-mobix_payment}
    depends_on:
      mongodb: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8084/ready"]

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      # Keep MongoDB 8 demo containers usable on kernels affected by SERVER-121912.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongodb:/data/db
    healthcheck:
      <<: *health
      test: [CMD, mongosh, --quiet, --eval, "if (!db.adminCommand({ping: 1}).ok) quit(1)"]

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      <<: *rabbit-env
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      <<: *health
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]

volumes:
  mongodb:
  rabbitmq:

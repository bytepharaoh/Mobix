name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
      - name: Verify dependency metadata
        run: |
          go mod verify
          go mod tidy -diff
      - run: make check build
      - run: make test

  stack:
    name: Compose acceptance and Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISPATCH_OFFER_TTL: 7s
      MOBIX_INTERNAL_KEY: mobix-ci-internal-signing-key-for-isolated-tests
      MOBIX_BOOTSTRAP_EMAIL: operator@mobix.test
      MOBIX_BOOTSTRAP_PASSWORD: mobix-ci-operator-password
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"
      - name: Validate deployment configuration
        run: |
          docker compose config --quiet
          kubectl kustomize deployments/k8s/base >/dev/null
          kubectl kustomize deployments/k8s/demo >/dev/null
      - run: make up
      - run: make demo
      - run: make dispatch-demo
      - run: make verify
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes
